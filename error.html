<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Restricted Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    #unsupported {
      display: block;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="unsupported">
    <h2>Access Restricted</h2>
    <p>This website is accessible only on laptop devices. Please switch to a laptop to view the content.</p>
    <button onclick="window.location.reload();">Refresh</button>
</div>
  <script src="script.js"></script>
</body>
</html>
